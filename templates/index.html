<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spamboat - Fake Follower Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="highlight">Spamboat</span> Detector</h1>
            <p>Advanced AI to identify Fake vs Genuine Profiles</p>
            <a href="/dashboard" class="btn btn-secondary">View Dashboard</a>
        </header>

        <main>
            <section class="prediction-section">
                {% if prediction_text %}
                <div class="result-box {{ prediction_class }}">
                    <h2>{{ prediction_text }}</h2>
                </div>
                {% endif %}

                <form action="/predict" method="POST" class="input-grid">
                    <div class="input-group">
                        <label>Profile Pic (0=No, 1=Yes)</label>
                        <select name="profile_pic" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Num/Len Username Ratio (0-1)</label>
                        <input type="number" step="0.01" name="nums_len_username" placeholder="e.g. 0.2" required>
                    </div>
                    <div class="input-group">
                        <label>Fullname Words Count</label>
                        <input type="number" name="fullname_words" placeholder="e.g. 2" required>
                    </div>
                    <div class="input-group">
                        <label>Num/Len Fullname Ratio (0-1)</label>
                        <input type="number" step="0.01" name="nums_len_fullname" placeholder="e.g. 0.0" required>
                    </div>
                    <div class="input-group">
                        <label>Name == Username (0=No, 1=Yes)</label>
                        <select name="name_eq_username" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Description Length</label>
                        <input type="number" name="desc_len" placeholder="e.g. 50" required>
                    </div>
                    <div class="input-group">
                        <label>External URL (0=No, 1=Yes)</label>
                        <select name="ext_url" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Private (0=No, 1=Yes)</label>
                        <select name="private" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label># Posts</label>
                        <input type="number" name="posts" placeholder="e.g. 100" required>
                    </div>
                    <div class="input-group">
                        <label># Followers</label>
                        <input type="number" name="followers" placeholder="e.g. 500" required>
                    </div>
                    <div class="input-group">
                        <label># Follows</label>
                        <input type="number" name="follows" placeholder="e.g. 200" required>
                    </div>

                    <div class="submit-container">
                        <button type="submit" class="btn btn-primary">Predict Account</button>
                    </div>
                </form>
            </section>
        </main>
        <footer>
            <p>&copy; 2025 Spamboat AI Systems</p>
        </footer>
    </div>
</body>
</html>
